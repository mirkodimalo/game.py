<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxy Siege</title>
  <style>
    :root {
      --bg1: #030b16;
      --bg2: #0c1830;
      --panel: rgba(10, 18, 30, 0.76);
      --cyan: #8ef0ff;
      --cyan-strong: #4dd7ff;
      --danger: #ff4d6d;
      --gold: #ffd166;
      --good: #7ef29a;
      --text: #edfaff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #11273d 0%, #050d16 58%, #02080f 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      cursor: crosshair;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .panel {
      position: absolute;
      top: 18px;
      left: 18px;
      background: linear-gradient(180deg, rgba(17, 29, 44, 0.9), rgba(9, 16, 24, 0.78));
      border: 1px solid rgba(142, 240, 255, 0.38);
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(7, 16, 24, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
      padding: 12px 16px;
      backdrop-filter: blur(6px);
    }

    .panel h1 {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(142, 240, 255, 0.7);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
    }

    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 5px 9px;
      min-width: 92px;
    }

    .center-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .box {
      pointer-events: auto;
      width: min(720px, calc(100vw - 30px));
      background: rgba(6, 12, 20, 0.85);
      border: 1px solid rgba(142, 240, 255, 0.45);
      border-radius: 20px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.52), inset 0 0 30px rgba(142,240,255,0.08);
      padding: 28px 22px;
      backdrop-filter: blur(10px);
    }

    .box h2 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
      color: var(--cyan);
      font-size: clamp(28px, 4vw, 54px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-shadow: 0 0 26px rgba(142, 240, 255, 0.7);
    }

    .instructions {
      color: #ebfaff;
      line-height: 1.7;
      font-size: 15px;
    }

    .instructions p {
      margin: 8px 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #9ef3ff, #3dc2ff);
      color: #04141d;
      box-shadow: 0 10px 24px rgba(61,194,255,0.45), inset 0 1px 0 rgba(255,255,255,0.45);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(61,194,255,0.58), inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .btn.alt {
      background: linear-gradient(180deg, #ffd166, #fa9f42);
      box-shadow: 0 10px 24px rgba(250,159,66,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .phone-controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 18px 18px max(18px, env(safe-area-inset-bottom));
      pointer-events: none;
      z-index: 30;
    }

    .joy-base {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(10, 17, 26, 0.5);
      border: 2px solid rgba(142, 240, 255, 0.22);
      box-shadow: inset 0 0 24px rgba(142,240,255,0.08), 0 12px 30px rgba(0,0,0,0.28);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    .joy-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      margin-left: -26px;
      margin-top: -26px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #dffcff, #7dd3fc 60%, #3ba8ff 100%);
      box-shadow: 0 12px 20px rgba(61, 194, 255, 0.45), inset 0 1px 0 rgba(255,255,255,0.8);
      transform: translate(0, 0);
      transition: transform 0.04s linear;
    }

    .fire-button {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: linear-gradient(180deg, #ffd166, #ff8c42);
      color: #221400;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 18px 34px rgba(255, 160, 70, 0.42), inset 0 1px 0 rgba(255,255,255,0.5);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      margin-right: 10px;
    }

    .fire-button:active {
      transform: scale(0.98);
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .panel { left: 10px; top: 10px; }
      .box { padding: 22px 16px; }
      .stat { min-width: 78px; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="panel">
      <h1>Galaxy Siege</h1>
      <div class="stats">
        <div class="stat">Score: <span id="scoreValue">0</span></div>
        <div class="stat">Lives: <span id="livesValue">5</span></div>
        <div class="stat">Wave: <span id="waveValue">1</span></div>
        <div class="stat">Weapon: <span id="weaponValue">Blaster</span></div>
      </div>
    </div>

    <div id="menuOverlay" class="center-overlay">
      <div class="box">
        <h2>Galaxy Siege</h2>
        <div class="instructions">
          <p>Choose your control style.</p>
          <p>PC: mouse + keyboard</p>
          <p>Phone: dynamic thumbstick + fire button</p>
        </div>
        <div class="controls">
          <button class="btn" id="pcModeBtn">PC</button>
          <button class="btn alt" id="phoneModeBtn">Phone</button>
        </div>
      </div>
    </div>

    <div id="gameOverOverlay" class="center-overlay hidden">
      <div class="box">
        <h2>Game Over</h2>
        <div class="instructions">
          <p>You scored <strong id="finalScore">0</strong> points.</p>
          <p>Press the button to jump back into the fight.</p>
        </div>
        <div class="controls">
          <button class="btn" id="restartBtn">Retry</button>
        </div>
      </div>
    </div>
  </div>

  <div id="phoneControls" class="phone-controls hidden">
    <div id="joyBase" class="joy-base" aria-label="move joystick">
      <div id="joyKnob" class="joy-knob"></div>
    </div>
    <button id="fireButton" class="fire-button" aria-label="Fire weapon">FIRE</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreValue = document.getElementById('scoreValue');
    const livesValue = document.getElementById('livesValue');
    const waveValue = document.getElementById('waveValue');
    const weaponValue = document.getElementById('weaponValue');
    const menuOverlay = document.getElementById('menuOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScore = document.getElementById('finalScore');
    const pcModeBtn = document.getElementById('pcModeBtn');
    const phoneModeBtn = document.getElementById('phoneModeBtn');
    const restartBtn = document.getElementById('restartBtn');
    const phoneControls = document.getElementById('phoneControls');
    const joyBase = document.getElementById('joyBase');
    const joyKnob = document.getElementById('joyKnob');
    const fireButton = document.getElementById('fireButton');

    const keys = {};
    const pointer = { x: 0, y: 0, active: false };

    let controlMode = 'pc';
    let state = 'menu';
    let lastTime = 0;
    let player = null;
    let bullets = [];
    let enemies = [];
    let pickups = [];
    let particles = [];
    let stars = [];
    let score = 0;
    let wave = 1;
    let spawnTimer = 0;
    let bossAlive = false;
    let messageText = '';
    let messageTimer = 0;
    let screenShake = 0;
    let weaponLevel = 1;
    let fireRate = 0.22;
    let fireHeld = false;

    const weaponNames = ['Blaster', 'Plasma', 'Nova', 'Vortex', 'Apex'];

    const joystick = {
      active: false,
      x: 0,
      y: 0,
      maxDistance: 34
    };

    function resetJoystick() {
      joystick.active = false;
      joystick.x = 0;
      joystick.y = 0;
      joyKnob.style.transform = 'translate(0px, 0px)';
    }

    function updatePhoneControlsVisibility() {
      if (controlMode === 'phone') {
        phoneControls.classList.remove('hidden');
      } else {
        phoneControls.classList.add('hidden');
      }
    }

    function setPointerFromScreen(x, y) {
      pointer.x = x;
      pointer.y = y;
      pointer.active = true;
    }

    function getPhoneMove() {
      return {
        x: joystick.x,
        y: joystick.y
      };
    }

    function getAimAngle() {
      if (controlMode === 'pc') {
        if (pointer.active) {
          return Math.atan2(pointer.y - player.y, pointer.x - player.x) || -Math.PI / 2;
        }
        return -Math.PI / 2;
      }

      const move = getPhoneMove();
      if (move.x !== 0 || move.y !== 0) {
        return Math.atan2(move.y, move.x);
      }

      return -Math.PI / 2;
    }

    function createStars() {
      const arr = [];
      const count = 220;
      for (let i = 0; i < count; i += 1) {
        arr.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2.2 + 0.5,
          speed: Math.random() * 35 + 15,
          alpha: Math.random() * 0.7 + 0.3
        });
      }
      return arr;
    }

    function resetPlayer() {
      player = {
        x: canvas.width * 0.5,
        y: canvas.height * 0.82,
        radius: 18,
        speed: 310,
        lives: 5,
        fireCooldown: 0,
        invuln: 0,
        tilt: 0,
        glow: 0
      };
    }

    function resetGame() {
      score = 0;
      wave = 1;
      spawnTimer = 0;
      bossAlive = false;
      bullets = [];
      enemies = [];
      pickups = [];
      particles = [];
      stars = createStars();
      weaponLevel = 1;
      fireRate = 0.22;
      messageText = 'Wave 1';
      messageTimer = 2.2;
      resetPlayer();
      updateHud();
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      if (!player) {
        resetPlayer();
      } else {
        player.x = Math.min(Math.max(player.x, 30), canvas.width - 30);
        player.y = Math.min(Math.max(player.y, 30), canvas.height - 30);
      }

      if (!stars.length) {
        stars = createStars();
      }
    }

    function updateHud() {
      scoreValue.textContent = Math.floor(score);
      livesValue.textContent = player ? player.lives : 0;
      waveValue.textContent = wave;
      weaponValue.textContent = weaponNames[Math.min(weaponLevel - 1, weaponNames.length - 1)];
    }

    function createBurst(x, y, color, amount = 16, speedBoost = 0) {
      for (let i = 0; i < amount; i += 1) {
        const a = Math.random() * Math.PI * 2;
        const speed = speedBoost + 45 + Math.random() * 190;
        particles.push({
          x,
          y,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          life: 0.5 + Math.random() * 0.8,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function spawnEnemy(type = 'scout') {
      const side = Math.floor(Math.random() * 4);
      const pad = 45;
      let x = 0;
      let y = 0;

      if (side === 0) { x = Math.random() * canvas.width; y = -pad; }
      else if (side === 1) { x = canvas.width + pad; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + pad; }
      else { x = -pad; y = Math.random() * canvas.height; }

      let speed = 110 + wave * 8 + Math.random() * 55;
      let radius = 18;
      let health = 2;
      let color = '#ff7d8a';
      let pattern = 'drift';

      if (type === 'brute') {
        radius = 28;
        health = 5 + wave;
        color = '#ffb86c';
        pattern = 'slow';
        speed *= 0.7;
      } else if (type === 'zigzag') {
        radius = 16;
        health = 3 + wave * 0.5;
        color = '#f06595';
        pattern = 'zigzag';
      } else if (type === 'spinner') {
        radius = 14;
        health = 2 + wave * 0.4;
        color = '#a78bfa';
        pattern = 'orbit';
      } else if (type === 'seeker') {
        radius = 17;
        health = 3 + wave * 0.6;
        color = '#7dd3fc';
        pattern = 'seeker';
        speed = 135 + wave * 10;
      } else if (type === 'bomber') {
        radius = 20;
        health = 4 + wave * 0.8;
        color = '#f59e0b';
        pattern = 'bomber';
        speed = 90 + wave * 5;
      } else if (type === 'boss') {
        radius = 62;
        health = 100 + wave * 32;
        color = '#ffd166';
        pattern = 'boss';
        speed = 75;
      }

      enemies.push({
        x, y, radius, speed, health, maxHealth: health, color, pattern,
        phase: Math.random() * Math.PI * 2,
        fireCooldown: 1.2 + Math.random() * 1.5
      });
    }

    function spawnPickup(x, y) {
      pickups.push({
        x,
        y,
        radius: 12,
        pulse: Math.random() * Math.PI * 2,
        kind: Math.random() < 0.55 ? 'heal' : 'weapon'
      });
    }

    function shootBullet() {
      if (!player || state !== 'playing') return;

      const angle = getAimAngle();
      const shotCount = Math.min(4, weaponLevel);
      const spread = weaponLevel > 3 ? 0.18 : 0.11;
      const bulletSpeed = weaponLevel >= 4 ? 720 : weaponLevel >= 3 ? 690 : 660;

      for (let i = 0; i < shotCount; i += 1) {
        const offset = shotCount === 1 ? 0 : (i - (shotCount - 1) / 2) * spread;
        const finalAngle = angle + offset;
        bullets.push({
          x: player.x + Math.cos(finalAngle) * 24,
          y: player.y + Math.sin(finalAngle) * 24,
          vx: Math.cos(finalAngle) * bulletSpeed,
          vy: Math.sin(finalAngle) * bulletSpeed,
          radius: weaponLevel >= 4 ? 5 : 4,
          damage: 1 + weaponLevel * 0.45,
          color: weaponLevel >= 4 ? '#ffb703' : weaponLevel >= 3 ? '#7ef29a' : '#8ef0ff',
          team: 'player'
        });
      }

      createBurst(player.x + Math.cos(angle) * 18, player.y + Math.sin(angle) * 18, '#8ef0ff', 7, 30);
      player.glow = 0.18;
      player.tilt = 12;
      screenShake = Math.max(screenShake, 4);
    }

    function startGame(mode) {
      controlMode = mode;
      resetGame();
      state = 'playing';
      menuOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      updatePhoneControlsVisibility();
      resetJoystick();
    }

    function gameOver() {
      state = 'gameover';
      finalScore.textContent = Math.floor(score);
      gameOverOverlay.classList.remove('hidden');
      resetJoystick();
    }

    function hitEnemy(enemy, damage) {
      enemy.health -= damage;
      if (enemy.health <= 0) {
        score += enemy.radius > 45 ? 200 : enemy.radius > 20 ? 90 : 45;
        createBurst(enemy.x, enemy.y, enemy.color, enemy.radius > 45 ? 34 : enemy.radius > 20 ? 22 : 14, 30);
        if (Math.random() < 0.18) spawnPickup(enemy.x, enemy.y);
        enemies = enemies.filter((item) => item !== enemy);

        if (bossAlive && !enemies.some((item) => item.pattern === 'boss')) {
          bossAlive = false;
          wave += 1;
          messageText = 'Wave ' + wave;
          messageTimer = 2.1;
          spawnWave();
        }
      }
    }

    function spawnWave() {
      const amount = 5 + wave * 2;
      for (let i = 0; i < amount; i += 1) {
        const roll = Math.random();
        let type = 'scout';
        if (wave >= 2 && roll > 0.68) type = 'zigzag';
        if (wave >= 3 && roll > 0.82) type = 'brute';
        if (wave >= 4 && roll > 0.9) type = 'spinner';
        if (wave >= 5 && roll > 0.95) type = 'seeker';
        spawnEnemy(type);
      }

      if (wave > 0 && wave % 4 === 0 && !bossAlive) {
        bossAlive = true;
        spawnEnemy('boss');
        messageText = 'Boss incoming!';
        messageTimer = 2.4;
      }
    }

    function updateStars(dt) {
      for (const star of stars) {
        star.y += star.speed * dt;
        if (star.y > canvas.height) {
          star.y = -10;
          star.x = Math.random() * canvas.width;
        }
      }
    }

    function updatePlayer(dt) {
      if (!player) return;

      let moveX = 0;
      let moveY = 0;

      if (controlMode === 'phone') {
        moveX = joystick.x;
        moveY = joystick.y;
      } else {
        moveX = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
        moveY = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
      }

      const len = Math.hypot(moveX, moveY) || 1;
      player.x += (moveX / len) * player.speed * dt;
      player.y += (moveY / len) * player.speed * dt;

      player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
      player.y = Math.max(30, Math.min(canvas.height - 30, player.y));

      player.fireCooldown -= dt;
      player.invuln = Math.max(0, player.invuln - dt);
      player.glow = Math.max(0, player.glow - dt * 2.2);
      player.tilt *= 0.88;

      const firing = keys[' '] || keys.Space || pointer.active || fireHeld;

      if (firing && player.fireCooldown <= 0) {
        shootBullet();
        player.fireCooldown = fireRate;
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i -= 1) {
        const bullet = bullets[i];
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;

        if (bullet.x < -40 || bullet.x > canvas.width + 40 || bullet.y < -40 || bullet.y > canvas.height + 40) {
          bullets.splice(i, 1);
          continue;
        }

        if (bullet.team === 'player') {
          for (let j = enemies.length - 1; j >= 0; j -= 1) {
            const enemy = enemies[j];
            const dx = bullet.x - enemy.x;
            const dy = bullet.y - enemy.y;
            if (Math.hypot(dx, dy) < enemy.radius + bullet.radius) {
              hitEnemy(enemy, bullet.damage);
              bullets.splice(i, 1);
              break;
            }
          }
          continue;
        }

        const dx = bullet.x - player.x;
        const dy = bullet.y - player.y;
        if (Math.hypot(dx, dy) < bullet.radius + player.radius) {
          player.lives -= 1;
          player.invuln = 1.2;
          createBurst(bullet.x, bullet.y, '#ff4d6d', 18, 30);
          bullets.splice(i, 1);
          screenShake = Math.max(screenShake, 6);

          if (player.lives <= 0) {
            gameOver();
            return;
          }
        }
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i -= 1) {
        const enemy = enemies[i];
        enemy.phase += dt * (enemy.pattern === 'zigzag' ? 7 : 3);

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.hypot(dx, dy) || 1;

        if (enemy.pattern === 'drift') {
          enemy.x += (dx / dist) * enemy.speed * dt * 0.92;
          enemy.y += (dy / dist) * enemy.speed * dt * 0.92;
        } else if (enemy.pattern === 'slow') {
          enemy.x += (dx / dist) * enemy.speed * dt * 0.7 + Math.cos(enemy.phase) * 18 * dt;
          enemy.y += (dy / dist) * enemy.speed * dt * 0.7 + Math.sin(enemy.phase) * 18 * dt;
        } else if (enemy.pattern === 'zigzag') {
          enemy.x += (dx / dist) * enemy.speed * dt * 1.08 + Math.cos(enemy.phase * 2) * 90 * dt;
          enemy.y += (dy / dist) * enemy.speed * dt * 1.08 + Math.sin(enemy.phase * 2) * 90 * dt;
        } else if (enemy.pattern === 'orbit') {
          enemy.x += Math.cos(enemy.phase) * 120 * dt;
          enemy.y += Math.sin(enemy.phase) * 120 * dt;
        } else if (enemy.pattern === 'seeker') {
          const seekX = (dx / dist) * enemy.speed * dt * 1.18;
          const seekY = (dy / dist) * enemy.speed * dt * 1.18;
          enemy.x += seekX + Math.cos(enemy.phase * 2) * 25 * dt;
          enemy.y += seekY + Math.sin(enemy.phase * 2) * 25 * dt;

          if (Math.random() < 0.015) {
            bullets.push({
              x: enemy.x,
              y: enemy.y,
              vx: (dx / dist) * 260,
              vy: (dy / dist) * 260,
              radius: 4,
              damage: 1,
              color: '#7dd3fc',
              team: 'enemy'
            });
          }
        } else if (enemy.pattern === 'bomber') {
          enemy.x += (dx / dist) * enemy.speed * dt * 0.75;
          enemy.y += (dy / dist) * enemy.speed * dt * 0.75;
          enemy.fireCooldown -= dt;
          if (enemy.fireCooldown <= 0) {
            bullets.push({
              x: enemy.x,
              y: enemy.y,
              vx: (dx / dist) * 260,
              vy: (dy / dist) * 260,
              radius: 6,
              damage: 1,
              color: '#f59e0b',
              team: 'enemy'
            });
            enemy.fireCooldown = 1.7 + Math.random() * 1.2;
          }
        } else if (enemy.pattern === 'boss') {
          enemy.x += Math.sin(enemy.phase) * 150 * dt;
          enemy.y += Math.cos(enemy.phase * 1.4) * 90 * dt;
          enemy.fireCooldown -= dt;
          if (enemy.fireCooldown <= 0) {
            const baseAngle = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            for (let b = 0; b < 7; b += 1) {
              const angle = baseAngle + (b - 3) * 0.28;
              bullets.push({
                x: enemy.x + Math.cos(angle) * 42,
                y: enemy.y + Math.sin(angle) * 42,
                vx: Math.cos(angle) * 290,
                vy: Math.sin(angle) * 290,
                radius: 6,
                damage: 1,
                color: '#ff7b00',
                team: 'enemy'
              });
            }
            enemy.fireCooldown = 1.1 + Math.random() * 0.5;
          }
        }

        const hitDistance = enemy.radius + player.radius + 5;
        if (Math.hypot(player.x - enemy.x, player.y - enemy.y) < hitDistance) {
          if (player.invuln <= 0) {
            player.lives -= 1;
            player.invuln = 1.2;
          }
          createBurst(enemy.x, enemy.y, '#ff4d6d', 24, 35);
          enemies.splice(i, 1);

          if (player.lives <= 0) {
            gameOver();
            return;
          }
        }
      }
    }

    function updatePickups(dt) {
      for (let i = pickups.length - 1; i >= 0; i -= 1) {
        const item = pickups[i];
        item.pulse += dt * 6;
        const dist = Math.hypot(player.x - item.x, player.y - item.y);

        if (dist < item.radius + player.radius + 2) {
          if (item.kind === 'heal') {
            player.lives = Math.min(8, player.lives + 1);
            messageText = '+1 life';
          } else {
            weaponLevel = Math.min(5, weaponLevel + 1);
            fireRate = Math.max(0.08, 0.22 - (weaponLevel - 1) * 0.03);
            messageText = 'Weapon upgraded';
          }
          messageTimer = 1.8;
          createBurst(item.x, item.y, '#ffd166', 15, 20);
          pickups.splice(i, 1);
          updateHud();
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateWave(dt) {
      if (state !== 'playing') return;
      spawnTimer -= dt;

      if (spawnTimer <= 0 && enemies.length < 16) {
        spawnTimer = Math.max(0.38, 1.05 - wave * 0.07) + Math.random() * 0.7;
        const roll = Math.random();
        let type = 'scout';
        if (wave >= 2 && roll > 0.7) type = 'zigzag';
        if (wave >= 3 && roll > 0.88) type = 'brute';
        if (wave >= 4 && roll > 0.94) type = 'spinner';
        if (wave >= 5 && roll > 0.97) type = 'seeker';
        spawnEnemy(type);
      }

      if (wave === 1 && score >= 250) {
        wave = 2;
        messageText = 'Wave 2';
        messageTimer = 2.0;
        spawnWave();
      } else if (wave === 2 && score >= 700) {
        wave = 3;
        messageText = 'Wave 3';
        messageTimer = 2.0;
        spawnWave();
      } else if (wave === 3 && score >= 1400) {
        wave = 4;
        messageText = 'Wave 4';
        messageTimer = 2.0;
        spawnWave();
      } else if (wave === 4 && score >= 2300) {
        wave = 5;
        messageText = 'Wave 5';
        messageTimer = 2.0;
        spawnWave();
      } else if (wave === 5 && score >= 3400) {
        wave = 6;
        messageText = 'Wave 6';
        messageTimer = 2.0;
        spawnWave();
      }
    }

    function update(dt) {
      if (state !== 'playing') {
        updateStars(dt);
        return;
      }

      screenShake = Math.max(0, screenShake - dt * 16);
      if (messageTimer > 0) messageTimer -= dt;

      updateStars(dt);
      updatePlayer(dt);
      updateBullets(dt);
      updateEnemies(dt);
      updatePickups(dt);
      updateParticles(dt);
      updateWave(dt);
      updateHud();
    }

    function drawBackground() {
      ctx.fillStyle = '#020a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const star of stars) {
        ctx.fillStyle = `rgba(180,220,255,${star.alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = 'rgba(120,170,255,0.06)';
      for (let i = 0; i < 6; i += 1) {
        ctx.fillRect(0, i * 180 + (performance.now() * 0.035) % 180, canvas.width, 1);
      }

      ctx.fillStyle = 'rgba(66,109,180,0.08)';
      ctx.beginPath();
      ctx.arc(canvas.width * 0.2, canvas.height * 0.18, 140, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(canvas.width * 0.8, canvas.height * 0.26, 175, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayer() {
      if (!player) return;
      if (player.invuln > 0 && Math.floor(player.invuln * 18) % 2 === 0) return;

      const pulse = player.glow > 0 ? 1 + player.glow * 6 : 1;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.tilt * Math.PI / 180);
      ctx.scale(pulse, pulse);

      ctx.fillStyle = '#8ef0ff';
      ctx.beginPath();
      ctx.moveTo(0, -player.radius - 10);
      ctx.lineTo(player.radius, player.radius);
      ctx.lineTo(0, player.radius - 8);
      ctx.lineTo(-player.radius, player.radius);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#dffbff';
      ctx.fillRect(-3, -5, 6, 16);
      ctx.restore();

      if (player.glow > 0) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(142,240,255,0.75)';
        ctx.lineWidth = 2;
        ctx.arc(player.x, player.y, player.radius + 8 + player.glow * 30, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.fillStyle = bullet.color;
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.fillStyle = enemy.color;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(enemy.x - enemy.radius, enemy.y - enemy.radius - 16, enemy.radius * 2, 6);

        const ratio = Math.max(0, enemy.health / enemy.maxHealth);
        ctx.fillStyle = '#8ef0ff';
        ctx.fillRect(enemy.x - enemy.radius, enemy.y - enemy.radius - 16, enemy.radius * 2 * ratio, 6);
      }
    }

    function drawPickups() {
      for (const item of pickups) {
        const s = Math.sin(item.pulse) * 2;
        ctx.fillStyle = item.kind === 'heal' ? '#7ef29a' : '#ffd166';
        ctx.beginPath();
        ctx.moveTo(item.x, item.y - 12 - s);
        ctx.lineTo(item.x + 9, item.y + 9 - s);
        ctx.lineTo(item.x - 9, item.y + 9 - s);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawMessage() {
      if (!messageTimer || messageTimer <= 0) return;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(142,240,255,0.9)';
      ctx.font = 'bold 28px Arial';
      ctx.fillText(messageText, canvas.width / 2, canvas.height * 0.18);
      ctx.restore();
    }

    function drawGame() {
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake * 2, (Math.random() - 0.5) * screenShake * 2);
      }
      drawBackground();
      drawPickups();
      drawParticles();
      drawBullets();
      drawEnemies();
      drawPlayer();
      drawMessage();
      ctx.restore();
    }

    function loop(timestamp) {
      const dt = Math.min(0.033, (timestamp - lastTime) / 1000 || 0.016);
      lastTime = timestamp;
      update(dt);
      drawGame();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[key] = true;
      if (key === ' ') {
        keys[' '] = true;
      }
      if (key === 'Spacebar') {
        keys.Space = true;
      }
    });

    window.addEventListener('keyup', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[key] = false;
      if (key === ' ') {
        keys[' '] = false;
      }
      if (key === 'Spacebar') {
        keys.Space = false;
      }
    });

    canvas.addEventListener('pointerdown', (event) => {
      setPointerFromScreen(event.clientX, event.clientY);
    });

    canvas.addEventListener('pointermove', (event) => {
      if (controlMode === 'pc') {
        setPointerFromScreen(event.clientX, event.clientY);
      }
    });

    canvas.addEventListener('pointerup', () => {
      pointer.active = false;
    });

    canvas.addEventListener('pointerleave', () => {
      pointer.active = false;
    });

    function updateJoystickFromPointer(clientX, clientY) {
      const rect = joyBase.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const distance = Math.min(Math.hypot(dx, dy), joystick.maxDistance);
      const angle = Math.atan2(dy, dx);

      joystick.x = Math.cos(angle) * (distance / joystick.maxDistance);
      joystick.y = Math.sin(angle) * (distance / joystick.maxDistance);

      const knobX = Math.cos(angle) * distance;
      const knobY = Math.sin(angle) * distance;
      joyKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;
    }

    joyBase.addEventListener('pointerdown', (event) => {
      joystick.active = true;
      updateJoystickFromPointer(event.clientX, event.clientY);
    });

    joyBase.addEventListener('pointermove', (event) => {
      if (!joystick.active) return;
      updateJoystickFromPointer(event.clientX, event.clientY);
    });

    joyBase.addEventListener('pointerup', resetJoystick);
    joyBase.addEventListener('pointerleave', resetJoystick);
    joyBase.addEventListener('pointercancel', resetJoystick);

    fireButton.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      fireHeld = true;
    });

    fireButton.addEventListener('pointerup', () => {
      fireHeld = false;
    });

    fireButton.addEventListener('pointerleave', () => {
      fireHeld = false;
    });

    fireButton.addEventListener('pointercancel', () => {
      fireHeld = false;
    });

    pcModeBtn.addEventListener('click', () => startGame('pc'));
    phoneModeBtn.addEventListener('click', () => startGame('phone'));
    restartBtn.addEventListener('click', () => startGame(controlMode));

    window.addEventListener('resize', resize);
    resize();
    updatePhoneControlsVisibility();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
